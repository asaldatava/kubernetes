apiVersion: batch/v1
kind: CronJob
metadata:
  name: example-cronjob
  namespace: dev
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cronjob
              image: busybox
              command: ["sh", "-c", "date && echo CronJob running"]
